name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  checklist:
    name: All PR tasks must be checked
    runs-on: ubuntu-latest
    steps:
      - name: Check all task boxes are completed
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Only enforce checkboxes under a "## Pre-merge checklist" section.
            // Test plan items (under "## Test plan") are informational and must
            // not block merges — they are checked off by the reviewer in-game.
            const sectionMatch = body.match(/##\s*Pre-merge checklist\b([\s\S]*?)(?=\n##\s|\s*$)/i);
            const section = sectionMatch ? sectionMatch[1] : '';

            const unchecked = (section.match(/- \[ \]/g) || []).length;
            const checked   = (section.match(/- \[x\]/gi) || []).length;
            const total     = unchecked + checked;

            console.log(`Pre-merge checklist tasks: ${checked}/${total} checked`);

            if (unchecked > 0) {
              core.setFailed(
                `${unchecked} pre-merge task(s) still unchecked. ` +
                `Check all items in the "Pre-merge checklist" section before merging.`
              );
            } else if (total === 0) {
              console.log('No pre-merge checklist found — skipping.');
            } else {
              console.log('All pre-merge tasks checked ✅');
            }
